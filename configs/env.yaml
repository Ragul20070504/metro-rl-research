# M6 RL environment configuration.
#
# STRICT PROVENANCE, as configs/simulator.yaml. Every scalar declares where its value comes
# from; any parameter marked `unresolved` makes this config refuse to load unless the run is
# explicitly tagged `sensitivity_sweep`.
#
# The observation layout itself is NOT configurable. It is frozen in protocol section 6.1 and
# implemented in src/environment/observation.py, which is the single source of truth for the
# vector, its Gymnasium space, the scaler, the leakage tests and docs/rl_environment.md.

provenance_required: true
config_id: env_v1
description: Gymnasium environment for metro train induction (protocol section 6).
version: 1

action:
  k_max:
    value: 2
    provenance: simulation_assumption
    note: >
      Discrete(k_max + 1). Protocol section 6.3 freezes this as "small: expected 2-3". Two is
      the largest value the infrastructure can actually deliver in one 5-minute interval at a
      150 s minimum headway (300 / 150 = 2), so a larger k_max would add actions that the mask
      could never enable and would dilute the policy's action distribution over dead choices.

observation:
  n_segments:
    value: 4
    provenance: simulation_assumption
    note: >
      K frozen line segments for the rolling-stock position summary (section 6.1 item 9).
      Four gives roughly six stations per segment on the 24-station line, coarse enough to
      generalise and fine enough to distinguish "trains bunched at one end" from "evenly spread".
  include_availability_channel:
    value: true
    provenance: simulation_assumption
    note: >
      Section 6.1 item 8. True for ppo_uq (the proposed method); the H7 ablation ppo_uq_noavail
      sets it false. Note that the protocol specifies the channel is *present only when
      enabled*, so disabling it changes observation dimensionality -- a confound documented in
      docs/rl_environment.md, distinct from the sigma arms, which never change dimensionality.

availability_signal:
  noise_sd:
    value: 0.10
    provenance: unresolved
    note: >
      Assumption A14. The noise level of the synthetic availability readout. No public
      per-train availability record exists for the modelled fleet (research_audit.md F.2), so
      there is no defensible value; it must be swept. Decision D-04 keeps a bounded optional
      extension at M4b that could anchor this to a detector operating point measured on
      MetroPT-3, with an explicit cross-domain caveat.
  frailty_log_sd:
    value: 0.35
    provenance: unresolved
    note: >
      Assumption A14. Log-normal spread of the latent per-train hazard multiplier, normalised
      to mean exactly 1 so the fleet-aggregate failure rate stays equal to the MDBF-calibrated
      value from M5. Zero reproduces the homogeneous M5 process exactly. Swept.
  mask_threshold:
    value: 0.0
    provenance: simulation_assumption
    note: >
      Availability level below which an idle train is not offered to the mask. Frozen at 0 (all
      idle trains offerable) so that availability information reaches the policy through the
      OBSERVATION only. A positive threshold would put the same information into the action
      mask as well, and H7 -- which asks what the availability *channel* is worth -- would no
      longer measure what it claims to.

reward:
  weight_id:
    value: w_balanced
    provenance: simulation_assumption
    note: >
      The primary configuration for the confirmatory H1 test (protocol section 6.5). The full
      frozen grid is in src/environment/reward.py; it is code, not config, so a run cannot
      invent a weight row that was never pre-registered.
  reference_scales_path:
    value: configs/reward_scales.json
    provenance: simulation_assumption
    note: >
      Fixed per-term divisors making alpha..delta interpretable (section 6.4). Computed once
      from a reference policy over train-period days and never recomputed. The file records
      which policy produced it.
  normalise_reward:
    value: false
    provenance: simulation_assumption
    note: >
      SB3 VecNormalize(norm_reward=True) is off, so reward scale stays interpretable and
      identical across arms (section 6.4).

episode:
  scenario:
    value: normal
    provenance: simulation_assumption
    note: Overridden per experiment; the four frozen families are in src/simulator/disruptions.py.
  day_type:
    value: weekday
    provenance: simulation_assumption
  strict_scaler:
    value: false
    provenance: simulation_assumption
    note: >
      Reportable runs set this true, which makes the environment refuse to start on an unfitted
      (identity) observation scaler. False is for smoke and unit tests.
